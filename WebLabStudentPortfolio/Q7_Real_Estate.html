<!DOCTYPE html>
<html>
<head>
    <title>Real Estate Property Listing</title>
</head>
<body>

    <h1>Property Listing Form</h1>
    <hr>

    <form>
        <p>
            Owner Name:<br>
            <input type="text" name="ownername" size="30">
        </p>

        <p>
            Email:<br>
            <input type="email" name="email" size="30">
        </p>

        <p>
            Phone:<br>
            <input type="tel" name="phone" size="30">
        </p>

        <p>
            Property Type:<br>
            <select name="propertytype">
                <option value="house">House</option>
                <option value="apartment">Apartment</option>
                <option value="plot">Plot</option>
                <option value="shop">Commercial Shop</option>
            </select>
        </p>

        <p>
            City:<br>
            <input type="text" name="city" list="citylist" size="30">
            <datalist id="citylist">
                <option value="Rawalpindi">
                <option value="Islamabad">
                <option value="Lahore">
                <option value="Multan">
                <option value="Faisalabad">
            </datalist>
        </p>

        <p>
            Number of Bedrooms:<br>
            <input type="number" name="bedrooms" min="1" max="20">
        </p>

        <p>
            Price:<br>
            <input type="number" name="price" min="100000">
        </p>

        <p>
            Property Availability Date:<br>
            <input type="date" name="availabledate">
        </p>

        <p>
            Property Website URL:<br>
            <input type="url" name="website" size="30">
        </p>

        <p>
            Property Description:<br>
            <textarea name="description" rows="6" cols="40"></textarea>
        </p>

        <p>
            Upload Property Images:<br>
            <input type="file" name="images" multiple>
        </p>

        <p>
            Property Features:<br>
            <input type="checkbox" name="features" value="garage"> Garage<br>
            <input type="checkbox" name="features" value="garden"> Garden<br>
            <input type="checkbox" name="features" value="security"> Security System<br>
            <input type="checkbox" name="features" value="furnished"> Furnished<br>
            <input type="checkbox" name="features" value="backup"> Electricity Backup
        </p>

        <p>
            <input type="submit" value="Submit Property">
        </p>
    </form>

</body>
</html>
